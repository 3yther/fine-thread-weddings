<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fine Thread Weddings</title>
<style>
:root{--putty:#C9C8BA;--ink:#000;--gold:#A87A2A}
body{margin:0;background:var(--putty);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:32px 20px}
h1{font:400 40px/1.1 Georgia,serif;text-transform:uppercase}
label{display:block;margin:14px 0 4px;font-size:13px;letter-spacing:.04em}
input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #000;border-radius:9px;background:#fff;font:inherit}
button,.pill{display:inline-block;background:#000;color:#fff;border:0;border-radius:999px;padding:12px 24px;font:inherit;text-decoration:none;cursor:pointer;margin-top:20px}
.card{background:#fff;border-radius:9px;padding:16px;margin:12px 0}
</style></head><body><main>{% block body %}{% endblock %}</main></body></html>
