{% extends "base.html" %}{% block body %}
<h1>Approval queue</h1>
<form method="post" action="/admin/logout" style="float:right"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="pill" style="background:#555;margin:0">Sign out</button></form>
{% for r in rows %}<div class="card"><b>{{ r.summary }}</b> <small>({{ r.kind }}, {{ r.status }})</small>
<p>{{ r.draft }}</p>
{% if r.status == 'pending' %}
<form method="post" action="/admin/queue/{{ r.id }}/approved" style="display:inline"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="pill">Approve</button></form>
<form method="post" action="/admin/queue/{{ r.id }}/rejected" style="display:inline"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="pill" style="background:#555">Reject</button></form>
{% endif %}</div>{% else %}<p>Nothing waiting.</p>{% endfor %}
{% endblock %}
